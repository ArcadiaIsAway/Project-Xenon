[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-xenon"
version = "0.3.0"
description = "Portable in-place directory encryption with optional panic lockdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project Xenon" }]
keywords = ["encryption", "argon2", "chacha20", "panic", "security"]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
xenon = "xenon.cli:main"

[tool.setuptools.packages.find]
include = ["xenon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
